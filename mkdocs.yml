site_name: HTM.Pony
site_description: Hierarchical Temporal Memory in Pony
site_url: https://d-led.github.io/htm.pony/
repo_url: https://github.com/d-led/htm.pony
theme:
  name: material
  features:
    - navigation.sections
    - navigation.top
    - content.code.copy
markdown_extensions:
  - admonition
  - tables
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.inlinehilite
  - pymdownx.highlight:
      anchor_linenums: true
      pygments_lang_class: true
  # The results page is a copy of what the benchmarks printed: the files under
  # docs/results/ are written by scripts/studies.sh, which CI diffs, so the
  # page cannot drift from the programs.
  - pymdownx.snippets:
      base_path: docs
      check_paths: true
nav:
  - Home: index.md
  - Getting started: getting-started.md
  - Concepts:
      - Representations: concepts/representations.md
      - Sparsity: concepts/sparsity.md
      - Topology: concepts/topology.md
      - Encoding: concepts/encoding.md
      - Columns and cells: concepts/columns-and-cells.md
      - Temporal memory: concepts/temporal-memory.md
      - Temporal pooler: concepts/temporal-pooler.md
  - Guides:
      - Spatial pooler: spatial-pooler.md
      - Actors: actors.md
      - Encoders: encoders.md
      - Picture encoders: image-encoder.md
      - Streaming anomaly detection: anomaly-detection.md
      - Classification: classification.md
  - Examples: examples.md
  - Results: results.md
  - Roadmap: roadmap.md
  - Handoff: handoff.md
  - Sources: sources.md
  - Tutorial: tutorial.md
  - Reference:
      - Modules: reference/modules.md
      - API: reference/api/index.md

  - Building the docs: building-the-docs.md

# The API reference is generated per type, so its hundred pages are linked from
# reference/api/index.md rather than listed here.
validation:
  nav:
    omitted_files: ignore
