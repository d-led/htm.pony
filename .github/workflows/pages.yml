name: Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install MkDocs
        run: pip install mkdocs-material

      # pony-doc ships inside the ponyc release, and the ponylang/ponyc image on
      # Docker Hub is older than the compiler this project targets and carries no
      # pony-doc. Installing the compiler here brings the documenter with it.
      - name: Install ponyc and pony-doc
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://raw.githubusercontent.com/ponylang/ponyup/latest-release/ponyup-init.sh | sh
          echo "$HOME/.local/share/ponyup/bin" >> "$GITHUB_PATH"
          "$HOME/.local/share/ponyup/bin/ponyup" update ponyc release

      - name: Generate the API reference
        run: python3 scripts/api-reference.py

      - name: Build the site
        run: mkdocs build --strict

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
