name: CI

on:
  push:
    branches: [master]
  pull_request:

env:
  # The stb_image decoder is a C source beside a package, and ponyc learns to
  # compile those in 0.65.0, so the compiler comes from ponyup - which is also
  # how a developer installs it. One action installs it for every job.
  PONYC_VERSION: 0.77.2

jobs:
  test:
    name: Build and test
    runs-on: ubuntu-latest
    # A hung test binary would otherwise sit on GitHub's default 360 minutes.
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/ponyc
        with:
          version: ${{ env.PONYC_VERSION }}

      - name: Compile and run the test suite
        working-directory: test
        run: corral run -- ponyc --debug && ./test

  examples:
    name: Build and run the examples
    runs-on: ubuntu-latest
    # Measured at about two and a half minutes for all twenty-two; the cap is
    # for a run that stops behaving, not for a run that is merely slow.
    timeout-minutes: 8

    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/ponyc
        with:
          version: ${{ env.PONYC_VERSION }}

      # Each example checks its own claim and exits non-zero when it fails, so
      # running them is the check. The list is run-all.sh's, not a copy of it:
      # the copy that used to live here stopped running the newer studies
      # without anyone noticing.
      #
      # The measurement examples are left out here and run by the studies job
      # below, in a release build: a debug build of one of them takes a minute
      # and a half on its own, and running the same programs twice is most of
      # what this job used to cost.
      - name: Build and run the demonstrations
        run: ./examples/run-all.sh --demos-only

      # Compiled, not timed. A shared CI runner is the one machine whose timings
      # mean nothing, but a benchmark that no longer builds is rot, and nobody
      # runs these by hand often enough to notice.
      - name: Build the benchmarks
        working-directory: microbenchmarks
        run: corral run -- ponyc

  studies:
    name: Measure the studies
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/ponyc
        with:
          version: ${{ env.PONYC_VERSION }}

      # The studies are seeded and read no clock, so the numbers the
      # documentation quotes are this job's output: run on a machine nobody is
      # using, and published, so every table can be traced to a run.
      - name: Run the studies
        run: ./scripts/studies.sh

      # The published copy is not typed in and not copied by hand: the run above
      # wrote docs/results/, and this puts it on master so the site and GitHub
      # show what the benchmarks just measured. `test/fixtures/studies/` still
      # has to be updated deliberately, which is what makes a behaviour change
      # fail rather than publish itself.
      - name: Publish the numbers the studies just measured
        # Only on master, and never from the commit this step made itself: the
        # second run finds nothing to publish and stops there.
        if: github.event_name == 'push' && github.actor != 'github-actions[bot]'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/results
          if git diff --cached --quiet; then
            echo "the published numbers are already current"
          else
            git commit -m "publish the numbers the benchmarks measured"
            git push
          fi

      - name: Write the numbers to the job summary
        run: |
          {
            echo "## Study output"
            echo
            echo "From \`scripts/studies.sh\` on ${GITHUB_SHA:0:7}."
            for file in build/studies/*.txt; do
              echo
              echo "### $(basename "$file" .txt)"
              echo '```'
              cat "$file"
              echo '```'
            done
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Keep the numbers
        uses: actions/upload-artifact@v7
        with:
          name: studies
          path: build/studies/
